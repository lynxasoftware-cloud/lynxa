spring.application.name=ebano-site

# Base de datos: por defecto H2 en archivo (funciona sin instalar nada).
# En Railway/produccion,  sobreescribir estas 3 con las de MySQL (igual que Bar Club):
#   DB_URL=jdbc:mysql://usuario:pass@host:puerto/basededatos
#   DB_USER=..
#   DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ebano-db;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}

# Tamano maximo de archivos subidos (imagenes y videos cortos para la galeria)
spring.servlet.multipart.max-file-size=65MB
spring.servlet.multipart.max-request-size=70MB

# Carpeta donde se guardan las imagenes subidas desde el panel.
# En Railway esto debe apuntar a un volumen persistente montado (si no, se pierde en cada deploy).
app.uploads.dir=${UPLOADS_DIR:./uploads}

# Credenciales del panel admin. IMPORTANTE: definir estas variables de entorno
# en produccion (Railway -> Variables). Si no se definen, se genera una
# contrasena aleatoria y se imprime UNA vez en el log al arrancar.
app.admin.username=${ADMIN_USER:}
app.admin.password=${ADMIN_PASSWORD:}

logging.level.com.ebano=INFO
